services:
  mysql:
    image: mysql:8.4
    container_name: modeltoys-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Genera .env con scripts/preparar-entorno.py}
      CARRITO_DB_USER: ${CARRITO_DB_USER:?Configura CARRITO_DB_USER}
      CARRITO_DB_PASSWORD: ${CARRITO_DB_PASSWORD:?Configura CARRITO_DB_PASSWORD}
      USUARIOS_DB_USER: ${USUARIOS_DB_USER:?Configura USUARIOS_DB_USER}
      USUARIOS_DB_PASSWORD: ${USUARIOS_DB_PASSWORD:?Configura USUARIOS_DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h localhost -uroot --password=\"$$MYSQL_ROOT_PASSWORD\" -e \"SELECT 1\""]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  ms-usuarios:
    build:
      context: .
      dockerfile: backend/ms-usuarios/Dockerfile
    environment:
      USUARIOS_DB_URL: jdbc:mysql://mysql:3306/modeltoys_usuarios?serverTimezone=UTC
      USUARIOS_DB_USER: ${USUARIOS_DB_USER}
      USUARIOS_DB_PASSWORD: ${USUARIOS_DB_PASSWORD}
      JWT_ISSUER: ${JWT_ISSUER:-modeltoys}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?Genera las claves locales}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?Genera las claves locales}
      ADMIN_BOOTSTRAP_NAME: ${ADMIN_BOOTSTRAP_NAME:-Administrador}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  ms-carrito:
    build:
      context: .
      dockerfile: backend/ms-carrito/Dockerfile
    environment:
      CARRITO_DB_URL: jdbc:mysql://mysql:3306/modeltoys_carrito?serverTimezone=UTC
      CARRITO_DB_USER: ${CARRITO_DB_USER}
      CARRITO_DB_PASSWORD: ${CARRITO_DB_PASSWORD}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ISSUER: ${JWT_ISSUER:-modeltoys}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  ms-admin:
    build:
      context: .
      dockerfile: backend/ms-admin/Dockerfile
    environment:
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ISSUER: ${JWT_ISSUER:-modeltoys}
      USUARIOS_SERVICE_URL: http://ms-usuarios:8081
      CARRITO_SERVICE_URL: http://ms-carrito:8082
    depends_on:
      ms-usuarios:
        condition: service_healthy
      ms-carrito:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  gateway:
    build:
      context: .
      dockerfile: backend/gateway/Dockerfile
    environment:
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ISSUER: ${JWT_ISSUER:-modeltoys}
      USUARIOS_SERVICE_URL: http://ms-usuarios:8081
      CARRITO_SERVICE_URL: http://ms-carrito:8082
      ADMIN_SERVICE_URL: http://ms-admin:8083
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      ms-usuarios:
        condition: service_healthy
      ms-carrito:
        condition: service_healthy
      ms-admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  mysql_data:
