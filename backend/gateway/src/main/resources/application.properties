
# =====================================
# API GATEWAY - MODELTOYS
# =====================================

server.port=8080
spring.application.name=gateway

# =====================================
# MICROSERVICIO USUARIOS - PUERTO 8081
# =====================================

spring.cloud.gateway.server.webflux.routes[0].id=usuarios
spring.cloud.gateway.server.webflux.routes[0].uri=${USUARIOS_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/usuarios/**,/api/foro/**

# =====================================
# MICROSERVICIO CARRITO - PUERTO 8082
# =====================================

spring.cloud.gateway.server.webflux.routes[1].id=carrito
spring.cloud.gateway.server.webflux.routes[1].uri=${CARRITO_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/carrito/**,/api/productos/**,/api/ordenes/**,/api/preventas/**

# =====================================
# MICROSERVICIO ADMIN - PUERTO 8083
# =====================================

spring.cloud.gateway.server.webflux.routes[2].id=admin
spring.cloud.gateway.server.webflux.routes[2].uri=${ADMIN_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/admin/**

app.jwt.public-key=${JWT_PUBLIC_KEY}
app.jwt.issuer=${JWT_ISSUER:modeltoys}
app.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088}
management.endpoints.web.exposure.include=health
