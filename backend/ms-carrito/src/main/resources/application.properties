server.port=8082
spring.application.name=ms-carrito
spring.datasource.url=${CARRITO_DB_URL:jdbc:mysql://localhost:3306/modeltoys_carrito?serverTimezone=UTC}
spring.datasource.username=${CARRITO_DB_USER:modeltoys_carrito}
spring.datasource.password=${CARRITO_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.jwt.public-key=${JWT_PUBLIC_KEY}
app.jwt.issuer=${JWT_ISSUER:modeltoys}
management.endpoints.web.exposure.include=health
