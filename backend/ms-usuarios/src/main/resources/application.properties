server.port=8081
spring.application.name=ms-usuarios
spring.datasource.url=${USUARIOS_DB_URL:jdbc:mysql://localhost:3306/modeltoys_usuarios?serverTimezone=UTC}
spring.datasource.username=${USUARIOS_DB_USER:modeltoys_usuarios}
spring.datasource.password=${USUARIOS_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
app.jwt.issuer=${JWT_ISSUER:modeltoys}
app.jwt.public-key=${JWT_PUBLIC_KEY}
app.jwt.private-key=${JWT_PRIVATE_KEY}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:1800}
